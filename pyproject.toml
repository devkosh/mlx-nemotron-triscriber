[project]
name = "mlx-nemotron-streaming"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlx-audio>=0.4.4",
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
mlx-nemotron = "mlx_nemotron.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.28.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
